<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Cadastre-se</title>
    </head>
<body>
     <form class="" action="cadastro.php" method="POST" onsubmit="return validarCadastro(event)">
        <div class="form-group">
            <label for="nomeCompleto" class="form-label">Nome Completo</label>
            <input type="text" id="nomeCompleto" name="nomeCompleto" class="form-control" placeholder="Digite seu nome completo" required>
        </div>

        <div class="form-group">
            <label for="nomeUsuario" class="form-label">Código Funcionario</label>
            <input type="number" id="codigoUsuario" name="codigoUsuario" class="form-control" placeholder="Digite seu codigo" required>
        </div>

        <div class="form-group">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="Digite seu email" required>
        </div>
        
        <div class="form-group">
            <label for="cpf" class="form-label">CPF (Apenas números)</label>
            <input type="text" id="cpf" name="cpf" class="form-control" oninput="mascCpf(this)" maxlength="14" placeholder="000.000.000-00" required>
        </div>

         <div class="form-group">
            <label for="telefone" class="form-label">Telefone</label>
            <input type="tel" id="telefone" name="telefone" class="form-control" oninput="mascTelefone(this)" placeholder="(00) 00000-0000" required>
        </div>

        <div class="form-group">
            <label for="senha" class="form-label">Senha</label>
            <input type="password" id="senha" name="senha" class="form-control" placeholder="Crie uma senha" required>
            <span class="password-toggle" onclick="togglePassword('senha')">
                <i class="fas fa-eye-slash"></i>
            </span>
        </div>

        <div class="form-group">
            <label for="confirmacaoSenha" class="form-label">Confirme sua Senha</label>
            <input type="password" id="confirmacaoSenha" name="confirmacaoSenha" class="form-control" placeholder="Confirme sua senha" required>
            <span class="password-toggle" onclick="togglePassword('confirmacaoSenha')">
                <i class="fas fa-eye-slash"></i>
            </span>
        </div>

        <button type="submit" class="btn btn-primary">Cadastrar</button>

        <div class="form-footer">
            <p>Já possui conta? <a href="login.php">Faça login</a></p>
            <p><a href="index.php">Voltar à página inicial</a></p>
        </div>
    </form>
    
</body>
</html>
